<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROJECT CONTEXT v1.1.6</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F6F7FB}iframe{display:block;width:100%;height:100dvh;border:0;background:#F6F7FB}</style>
</head>
<body>
<iframe id="app" src="./project_context_v1_1_4_interactive.html?v=116" title="PROJECT CONTEXT"></iframe>
<script>
const ROUTES={
 '공동주택':{key:'사업계획승인 · 건축허가 · 사용검사/사용승인',routes:'주택법 사업계획승인 / 건축법상 건축허가 / 재개발·재건축 등 정비사업',remember:'신입 단계에서는 무슨 허가인지 맞힐 필요 없습니다. 공동주택도 사업방식에 따라 경로가 달라질 수 있다는 것만 기억하세요.',flow:['사업조건','규모·법규','계획설계','심의','승인/허가','설계','준공']},
 '업무시설':{key:'건축허가 · 사용승인 · 지구단위계획',routes:'일반 건축허가 중심 / 필요 시 개발사업·지구단위계획·각종 심의 연계',remember:'업무시설에서 주택 정비사업을 고르는 식의 선택은 하지 않습니다. 보통 건축법상 허가 흐름을 중심으로 봅니다.',flow:['대지조사','규모검토','계획설계','심의','건축허가','착공','사용승인']},
 '물류센터':{key:'창고시설 · 물류터미널 · 물류단지',routes:'일반 창고 건축허가 / 물류터미널 관련 절차 / 물류단지개발사업',remember:'물류센터라는 이름만으로 공사시행인가를 단정하지 않습니다. 사업 성격부터 나눕니다.',flow:['사업성격','입지','규모·법규','소방·교통','허가/승인','공사','사용/준공']},
 '공항시설 / 격납고':{key:'공항개발사업 · 건축허가 · 관계기관 협의',routes:'일반 건축 인허가 / 공항개발사업 관련 시행허가·실시계획 승인 여부 확인',remember:'공항 안 건물이라고 모두 동일한 특별법 절차를 밟는 것은 아닙니다.',flow:['사업성격','공항조건','계획','관계기관협의','허가/승인','공사','준공']},
 '지식산업센터':{key:'설립승인 · 건축허가 · 사용승인 · 완료신고',routes:'산업집적법상 지식산업센터 절차 + 건축법상 건축 인허가',remember:'일반 오피스처럼 건축허가만 보면 절차를 놓칠 수 있습니다.',flow:['입지·설립요건','설립승인','건축인허가','공사','사용승인','설립완료신고']}
};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function patch(){
 const f=document.getElementById('app');
 const d=f.contentDocument,w=f.contentWindow;if(!d||!w)return;
 const version=[...d.querySelectorAll('.topchip')].find(x=>x.textContent.includes('v1.1.4'));if(version)version.textContent='v1.1.6';
 [...d.querySelectorAll('#project .soft-note')].forEach(x=>{if(x.textContent.includes('디자인 방향'))x.remove()});
 const hero=d.querySelector('#project .hero .card .muted');if(hero)hero.textContent='현재 레벨에 맞는 정보만 보여줍니다. 신입사원은 무슨 허가인지 맞히는 대신, 자신이 아는 설계 단계와 업무를 입력해 프로젝트 흐름부터 익힙니다.';
 const business=d.getElementById('business');
 if(business){const box=business.parentElement;box.innerHTML='<label>규모·메모 <span style="font-weight:700;color:#9AA2B2">(선택)</span></label><input id="projectMeta" placeholder="예: 800세대 / 연면적 3만㎡">';}
 const phase=d.getElementById('phase');if(phase)phase.innerHTML='<option>잘 모르겠습니다</option><option>사전기획 / 사업검토</option><option>기본계획</option><option>계획설계</option><option>중간설계</option><option>실시설계</option><option>시공·현장 대응</option>';
 const task=d.getElementById('task');if(task)task.innerHTML='<option>법규·규모 검토</option><option>디자인</option><option>모델링·CG</option><option>도면 작성</option><option>심의자료 작성</option><option>인허가 자료 작성</option><option>변경 업무</option><option>협력업체 조정</option>';
 const old=d.getElementById('analyzeProjectBtn');if(!old)return;
 if(!d.querySelector('.lv1-route-note')){const note=d.createElement('div');note.className='soft-note lv1-route-note';note.style.marginTop='12px';note.innerHTML='<b>신입사원은 ‘건축허가인지 정비사업인지’를 몰라도 됩니다.</b> 지금 아는 설계 단계와 맡은 업무만 입력하세요. 사업의 법적 경로는 프로젝트 유형에 맞는 후보만 보여주고, 선임 단계부터 구분 방법을 알려줍니다.';old.parentNode.insertBefore(note,old)}
 const btn=old.cloneNode(true);old.replaceWith(btn);
 btn.addEventListener('click',()=>{
   const facility=d.getElementById('facility').value,phaseVal=d.getElementById('phase').value,taskVal=d.getElementById('task').value,meta=d.getElementById('projectMeta')?.value.trim()||'',x=ROUTES[facility]||ROUTES['업무시설'];
   const level=Math.max(1,Math.min(5,Number(w.localStorage.getItem('pc_level')||1)));
   let more='';
   if(level>=2)more+='<div class="info-card"><small>LV.2 · WHY / WHERE</small><b>사업 경로는 이렇게 확인</b><p>'+esc(x.routes)+'</p></div>';
   if(level>=3)more+='<div class="info-card"><small>LV.3 · HOW</small><b>실무에서</b><p>현재 단계의 도면·협력업체·인허가 영향을 함께 확인합니다.</p></div>';
   if(level>=4)more+='<div class="info-card"><small>LV.4 · JUDGEMENT</small><b>예외·판단</b><p>사업방식과 특별법에 따라 일반 흐름과 다른 경우를 구분합니다.</p></div>';
   const r=d.getElementById('projectResult');
   r.innerHTML='<div class="result-head"><div><small>NOW</small><b>'+esc((phaseVal==='잘 모르겠습니다'?'현재 설계 단계 미상':phaseVal)+' · '+taskVal)+'</b></div><div><small>KEY</small><b>'+esc(x.key)+'</b></div><div><small>REMEMBER</small><b>'+esc(x.remember)+'</b></div></div><div class="flow">'+x.flow.map((v,i)=>(i?'<i>→</i>':'')+'<span>'+esc(v)+'</span>').join('')+'</div>'+(meta?'<div class="soft-note"><b>입력한 규모·메모</b> · '+esc(meta)+'</div>':'')+(more?'<div class="info-grid">'+more+'</div>':'')+(level===1?'<div class="soft-note"><b>사업 경로는 지금 몰라도 됩니다.</b> · 가능한 경로 후보: <b>'+esc(x.routes)+'</b>. 선임 단계가 열리면 무엇을 보고 구분하는지 설명합니다.</div>':'');
   r.classList.add('show');r.scrollIntoView({behavior:'smooth',block:'nearest'});
 });
}
document.getElementById('app').addEventListener('load',patch);
</script>
</body></html>
