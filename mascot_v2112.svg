<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 460" role="img" aria-label="척척 건축 실무 도우미 캐릭터">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
