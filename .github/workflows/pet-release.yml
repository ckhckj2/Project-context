name: Desktop pet preview release
on:
  push:
    branches: [main]
    paths: ['desktop-pet/source/**', '.github/workflows/pet-release.yml']
permissions:
  contents: read
concurrency:
  group: desktop-pet-preview-release
  cancel-in-progress: false
env:
  PET_VERSION: '0.8.1'
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Restore reviewed source snapshot
        run: |
          cat desktop-pet/source/*.part > /tmp/pet-source.zip
          echo 'af37ea6c6fdfadea6233d81bde9b6c626a5eb3f2f28c5b347aa68e9d351975dd  /tmp/pet-source.zip' | sha256sum -c -
          unzip -q /tmp/pet-source.zip -d /tmp/pet-build
      - name: Check release pages and prepare browser testing
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node tools/check-release-browser.cjs
      - name: Check and package
        working-directory: /tmp/pet-build/cheokcheokpet
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run check:browser
          npm run package:win
          mkdir /tmp/pet-download
          cp -r dist/CheokcheokPet-win32-x64 /tmp/pet-download/CheokcheokPet
          cp README.md /tmp/pet-download/README.md
          cp tools/export-projects.html /tmp/pet-download/export-projects.html
          cd /tmp/pet-download
          zip -qr /tmp/CheokcheokPet-${PET_VERSION}-windows-x64.zip .
          cp /tmp/pet-source.zip /tmp/cheokcheokpet-${PET_VERSION}-source.zip
          cd /tmp
          sha256sum CheokcheokPet-${PET_VERSION}-windows-x64.zip cheokcheokpet-${PET_VERSION}-source.zip > SHA256SUMS.txt
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create pet-v${PET_VERSION} /tmp/CheokcheokPet-${PET_VERSION}-windows-x64.zip /tmp/cheokcheokpet-${PET_VERSION}-source.zip /tmp/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "척척펫 ${PET_VERSION} Windows 시안" --notes 'Windows x64 시안입니다. ZIP 전체를 풀고 CheokcheokPet.exe를 실행하세요. 55개 자동 검사와 실제 HTML·Canvas 브라우저 검사 통과. 파일 가져오기 중 화면 이동 시 오래된 단계가 남는 문제, 웹 연결 및 프로젝트 JSON 내보내기를 수정했습니다. 실제 Windows 실행, 전자서명 및 백신 검사는 미수행입니다. 회사 보안 정책을 따르세요. 자동 업데이트는 없습니다. 프로젝트 내보내기 안내는 ZIP 안의 export-projects.html에 있습니다.'
