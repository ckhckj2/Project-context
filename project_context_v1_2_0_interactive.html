TEP 2</div><h2>어떤 프로젝트인가요?</h2><p class="muted">신입이 알아볼 수 있는 프로젝트 이름부터 선택합니다.</p><div class="box"><div id="cats" class="segment-grid"></div><div style="font-size:11px;font-weight:900;margin:13px 0 7px">세부 프로젝트 / 용도</div><div id="subs" class="choice-grid"></div><div id="secbox"></div><div id="routebox"></div><div id="sum" class="sum"></div></div><div class="formgrid" style="margin-top:14px"><div><label>현재 설계 단계</label><select id="phase"><option>잘 모르겠습니다</option><option>사전기획 / 사업검토</option><option>기본계획</option><option>계획설계</option><option>중간설계</option><option>실시설계</option><option>시공·현장 대응</option></select></div><div><label>현재 업무</label><select id="task"><option>법규·규모 검토</option><option>디자인</option><option>모델링·CG</option><option>도면 작성</option><option>심의자료 작성</option><option>인허가 자료 작성</option><option>변경 업무</option><option>협력업체 조정</option></select></div><div style="grid-column:1/-1"><label>규모·메모 (선택)</label><input id="meta" placeholder="예: 800세대 / 연면적 3만㎡"></div></div><button class="btn primary full" id="go">프로젝트 맥락 분석하기 →</button>';function item(){return C[cat].find(x=>x[0]===sub)||C[cat][0]}function render(){d.getElementById('cats').innerHTML=Object.keys(C).map(x=>'<button class="seg '+(x===cat?'active':'')+'" data-c="'+e(x)+'">'+e(x)+'</button>').join('');d.getElementById('cats').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;sub=C[cat][0][0];sec=SEC[sub]?.[0]||'';route='잘 모르겠어요';render()});d.getElementById('subs').innerHTML=C[cat].map(x=>'<button class="choice '+(x[0]===sub?'active':'')+'" data-s="'+x[0]+'">'+e(x[1])+'<span class="legal">'+e(x[2])+'</span></button>').join('');d.getElementById('subs').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;sec=SEC[sub]?.[0]||'';route='잘 모르겠어요';render()});const sb=d.getElementById('secbox');sb.innerHTML=SEC[sub]?'<div style="font-size:11px;font-weight:900;margin:13px 0 7px">세부 유형</div><div class="choice-grid">'+SEC[sub].map(x=>'<button class="choice '+(x===sec?'active':'')+'" data-x="'+e(x)+'">'+e(x)+'</button>').join('')+'</div>':'';sb.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{sec=b.dataset.x;render()});const rb=d.getElementById('routebox');rb.innerHTML=R[sub]?'<div style="font-size:11px;font-weight:900;margin:13px 0 7px">사업방식을 알고 있나요?</div><div class="keys">'+R[sub].map(x=>'<button class="choice '+(x===route?'active':'')+'" data-r="'+e(x)+'">'+e(x)+'</button>').join('')+'</div>':'';rb.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{route=b.dataset.r;render()});const it=item();d.getElementById('sum').innerHTML='<b>'+e(cat)+' → '+e(it[1]+(sec?' · '+sec:''))+'</b><br>'+e(it[2])}render();d.getElementById('go').onclick=()=>{const it=item(),x=I[sub]||I.office,ph=d.getElementById('phase').value,task=d.getElementById('task').value,meta=d.getElementById('meta').value.trim(),r=d.getElementById('projectResult');r.innerHTML='<div class="result-head"><div><small>PROJECT</small><b>'+e(it[1]+(sec?' · '+sec:''))+'</b></div><div><small>MY STAGE</small><b>'+e(ph)+'</b></div><div><small>MY TASK</small><b>'+e(task)+'</b></div></div><div class="lvmap"><b>이 프로젝트의 큰 그림</b><div class="flowx">'+x[1].map((v,i)=>(i?'<span class="arr">→</span>':'')+'<span class="node">'+e(v)+'</span>').join('')+'</div><div style="font-size:9px;font-weight:900;color:#99A0AE;margin-top:13px">신입이 먼저 익힐 핵심 용어</div><div class="keys">'+x[0].map(v=>'<span>'+e(v)+'</span>').join('')+'</div><div class="warn"><b>! 한 가지만 기억</b><br>'+e(x[2])+'</div></div>'+(meta?'<div class="soft-note"><b>입력한 규모·메모</b> · '+e(meta)+'</div>':'')+'<div class="soft-note"><b>지금은 여기까지만.</b> · 왜 이 순서인지, 어디서 확인하는지, 실제 체크리스트는 선임 단계부터 열립니다.</div>';r.classList.add('show');r.scrollIntoView({behavior:'smooth',block:'nearest'})}}
document.getElementById('app').addEventListener('load',patch);
</script></body></html>
